<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">H and S heart monogram</title>
  <desc id="desc">A fine rose-gold heart outline enclosing intertwined handwritten H and S strokes with a small heart between them.</desc>
  <defs>
    <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE4D5"/>
      <stop offset="0.48" stop-color="#EAA7B7"/>
      <stop offset="1" stop-color="#F7D0B0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- A simple, hand-drawn heart keeps the mark legible at favicon size. -->
  <path d="M100 36
           C89 18 72 14 57 21
           C37 29 27 47 29 66
           C31 89 56 113 100 154
           C144 113 169 89 171 66
           C173 47 163 29 143 21
           C128 14 111 18 100 36Z"
        fill="none" stroke="url(#roseGold)" stroke-width="3.1"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <!-- H, drawn as elegant monoline strokes rather than font glyphs. -->
  <g fill="none" stroke="url(#roseGold)" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M61 113 C67 91 76 61 84 42"/>
    <path d="M92 116 C99 89 107 61 114 42"/>
    <path d="M47 88 C60 80 72 77 82 80 C94 84 105 99 119 105"/>
    <!-- S, finishing in the lower point of the heart. -->
    <path d="M153 45
             C146 39 136 41 129 47
             C120 54 121 63 132 69
             C143 75 154 77 154 87
             C155 99 141 109 127 119
             C116 127 108 141 100 154"/>
  </g>
  <!-- The little heart is the central detail of the reference mark. -->
  <path d="M112 82
           C107 75 99 78 101 85
           C102 90 112 97 112 97
           C112 97 122 90 123 85
           C125 78 117 75 112 82Z"
        fill="#F5C7D1" stroke="#FFE5DC" stroke-width="1.1" filter="url(#softGlow)"/>
</svg>
